<!-- Network bridge. Figma's main thread has no fetch, so everything that touches the network
     happens here and crosses to code.js by postMessage. This file holds no migration logic. -->
<style>
  body { font: 12px -apple-system, "Segoe UI", sans-serif; margin: 0; padding: 12px; color: #333; }
  #s { font-weight: 600; margin-bottom: 6px; }
  #l { white-space: pre-wrap; font: 11px ui-monospace, Menlo, Consolas, monospace; color: #666;
       max-height: 180px; overflow: auto; }
  .off { color: #b00; } .on { color: #0a0; }
  #go { display: block; width: 100%; margin: 4px 0 8px; padding: 8px; font: 600 12px inherit;
        color: #fff; background: #0d99ff; border: 0; border-radius: 6px; cursor: pointer; }
  #go[disabled] { background: #9dcff0; cursor: default; }
  #p { white-space: pre-wrap; font: 11px ui-monospace, Menlo, Consolas, monospace; color: #333;
       margin-bottom: 6px; }
</style>
<div id="s">connecting…</div>
<button id="go" hidden>Перенести файл из Pixso</button>
<div id="p"></div>
<div id="l"></div>
<script>
// The button exists because a designer should not have to drive this from a terminal. It cannot
// start the migration itself — this frame may only talk to one address and has no way to reach
// Pixso — so it asks the runner to start, and the runner does everything and sends its progress
// back here. The runner has to be running first; when it is not, there is nothing to press.
const HOST = "http://localhost:3778";
const CHUNK = 400000;
const S = document.getElementById("s"), L = document.getElementById("l");
let busy = false, misses = 0;

function log(m) { L.textContent = (m + "\n" + L.textContent).slice(0, 4000); }
function status(t, cls) { S.textContent = t; S.className = cls || ""; }

// Every request needs a deadline. When the runner exits mid-request the fetch never settles: the
// await in the poll loop then never returns, the setTimeout that schedules the next poll is never
// reached, and the plugin sits there looking alive with a dead poll loop. That is why only
// reopening the plugin ever brought it back.
function fetchT(url, opts, ms) {
  const ctl = typeof AbortController === "function" ? new AbortController() : null;
  const t = setTimeout(() => { if (ctl) ctl.abort(); }, ms || 15000);
  const o = Object.assign({}, opts || {});
  if (ctl) o.signal = ctl.signal;
  return Promise.race([
    fetch(url, o),
    new Promise((_, rej) => setTimeout(() => rej(new Error("timeout " + url)), (ms || 15000) + 1000)),
  ]).finally(() => clearTimeout(t));
}

async function post(path, body) {
  return fetchT(HOST + path, { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body) }, 20000).then(r => r.json());
}

function send(msg) { parent.postMessage({ pluginMessage: msg }, "*"); }

// While code.js is building, this frame keeps running, so it can tell the runner the plugin is
// alive. Without it the runner cannot tell a long build from a closed window.
let beat = null, rbuf = [], watchdog = null;
// Hashes whose bytes have already crossed into the plugin this session.
const sentImages = new Set();
// How long a job may go without reporting before this frame stops waiting for it. A wedge costs
// exactly this much of a run — but so does cutting off a build that was going to finish, and the
// heaviest object in a file hands over 27 MB of payload and 100 MB of photographs before the
// sandbox starts. So: a floor of eight minutes, plus a minute for every 5 MB handed over.
const WATCHDOG_FLOOR_MIN = 8;
let handedOver = 0;
function watchdogMinutes() {
  return Math.max(WATCHDOG_FLOOR_MIN, Math.ceil(handedOver / (5 * 1024 * 1024)));
}
function startBeat(id) {
  stopBeat();
  beat = setInterval(() => { post("/alive", { id }).catch(() => {}); }, 5000);
  // A job that never reports back used to latch this frame on "busy" for good while the heartbeat
  // kept telling the runner all was well. After this deadline the frame gives up on the job, says
  // so, and goes back to polling — a lost job costs one run, a latched plugin costs the session.
  clearTimeout(watchdog);
  const mins = watchdogMinutes();
  watchdog = setTimeout(() => {
    if (!busy) return;
    stopBeat();
    log("job " + id + " produced no report in " + mins + " minutes — telling the runner, still waiting");
    status("job " + id + " overran — waiting for the sandbox to come back", "off");
    post("/report", { id: id, i: 0, n: 1, d: JSON.stringify({ error: "no report from the plugin sandbox within " + mins + " minutes" }) }).catch(() => {});
    // Deliberately NOT freeing the frame here. The sandbox is single-threaded: if it is still
    // working, taking the next job now queues a second payload behind the first and the two jobs
    // interleave — which is how one slow object turned into a second failure that had nothing
    // wrong with it. The runner is told the job is lost; the frame waits for the sandbox to
    // finish before it takes anything else, and only gives up on it after as long again.
    watchdog = setTimeout(() => {
      if (!busy) return;
      log("sandbox never came back for " + id + " — resetting");
      status("idle — waiting for the next job", "on");
      busy = false;
      poll();
    }, mins * 60 * 1000);
  }, mins * 60 * 1000);
}
function stopBeat() { if (beat) { clearInterval(beat); beat = null; } clearTimeout(watchdog); watchdog = null; }

async function runJob(job) {
  log("job " + job.id + " (" + job.kind + ")");
  status("running job " + job.id + "…", "on");

  // payload as text, handed over in slices so a multi-megabyte string never crosses in one message
  const text = await fetchT(HOST + "/job/" + job.id + "/payload", {}, 120000).then(r => r.text());
  handedOver = text.length;
  send({ t: "payload-begin", id: job.id, kind: job.kind, total: text.length,
         rootNodeId: job.rootNodeId || null, cleanupRootId: job.cleanupRootId || null,
         page: job.page || null, pageBg: job.pageBg || null });
  for (let o = 0; o < text.length; o += CHUNK) send({ t: "payload-chunk", d: text.slice(o, o + CHUNK) });

  // Image bytes, one message each; the plugin turns them into Figma images and keeps the hash map.
  // Migrating a file is one job per top-level object and the same photograph belongs to dozens of
  // them, so a hash already sent this session is skipped — the other side keeps its map across
  // jobs. On a photo-heavy file this is most of the traffic.
  const imgs = job.images || [];
  let fetched = 0;
  for (let i = 0; i < imgs.length; i++) {
    if (sentImages.has(imgs[i])) continue;
    const b64 = await fetchT(HOST + "/image/" + imgs[i] + "?b64=1", {}, 120000).then(r => r.text());
    send({ t: "image-begin", hash: imgs[i], total: b64.length });
    for (let o = 0; o < b64.length; o += CHUNK) send({ t: "image-chunk", d: b64.slice(o, o + CHUNK) });
    send({ t: "image-end", hash: imgs[i] });
    handedOver += b64.length;
    sentImages.add(imgs[i]);
    fetched++;
    status("images " + fetched + " new of " + imgs.length, "on");
  }
  // Said out loud because when a job stops answering, this window is the only place that knows
  // how far it got: payload handed over, images handed over, or lost inside the sandbox.
  log("job " + job.id + ": payload " + text.length + " chars, " + fetched + " new images of " + imgs.length);
  startBeat(job.id);
  status("building — this can take a few minutes", "on");
  send({ t: "payload-end" });
}

onmessage = async (e) => {
  const m = e.data.pluginMessage;
  if (!m) return;
  if (m.t === "log") { log(m.m); return; }
  if (m.t === "report-begin") { rbuf = []; return; }
  if (m.t === "report-chunk") { rbuf.push(m.d); return; }
  if (m.t === "report-end") {
    stopBeat();
    const text = rbuf.join(""); rbuf = [];
    log("report for " + m.id + " (" + text.length + " chars)");
    // Sliced on the way out as well: the runner reassembles. One request per 400 000 characters.
    try {
      const n = Math.max(1, Math.ceil(text.length / CHUNK));
      for (let i = 0; i < n; i++) {
        await post("/report", { id: m.id, i: i, n: n, d: text.substr(i * CHUNK, CHUNK) });
      }
    } catch (err) { log("post failed: " + err); }
    busy = false;
    status("idle — waiting for the next job", "on");
    poll();
  }
};

// The runner holds this request until it has a job, so the loop spends its life inside a fetch
// rather than inside a timer. That matters because Chromium throttles timers in a background
// window to one wake-up a minute: on a timer this plugin asked for work once a minute while the
// runner, hearing nothing for 45 seconds, decided it was not there. Held requests need no timer,
// so a job is picked up the instant it is posted no matter which window is in front.
// One loop, and it only runs while there is nothing to wait for. Written as a loop rather than a
// chain of self-calls because the chain had a hole: while a job was running it re-entered itself
// with nothing to await, which is not a poll but a spin — it took the frame's thread and the
// report from the sandbox could never be handled. The build sat there until the runner gave up.
//
// While a job is running this returns and stops entirely. Whatever ends the job — the report
// arriving, or the watchdog giving up on it — starts it again.
let polling = false;
const GO = document.getElementById("go"), P = document.getElementById("p");
GO.onclick = async () => {
  GO.disabled = true;
  GO.textContent = "Идёт перенос…";
  try { await post("/start", {}); } catch (e) { log("could not start: " + e); GO.disabled = false; }
};

// What the runner is doing, in this window, because the person who pressed the button is looking
// at Figma and not at a console.
async function control() {
  try {
    const c = await fetchT(HOST + "/control", {}, 8000).then(r => r.json());
    GO.hidden = false;
    if (c.phase === "idle") { GO.disabled = false; GO.textContent = "Перенести файл из Pixso"; }
    else if (c.phase === "done") { GO.disabled = true; GO.textContent = "Готово"; }
    P.textContent = (c.lines || []).join(String.fromCharCode(10));
  } catch (e) { GO.hidden = true; P.textContent = ""; }
  setTimeout(control, 2000);
}
control();

async function poll() {
  if (polling) return;
  polling = true;
  try {
    while (!busy) {
      let ok = false;
      try {
        // The runner holds this request until it has a job, so the wait IS the request. That
        // matters because Chromium throttles timers in a background window to one wake-up a
        // minute: on a timer this plugin asked for work once a minute while the runner, hearing
        // nothing for 45 seconds, decided it was not there.
        const j = await fetchT(HOST + "/job?client=plugin", {}, 40000).then(r => r.json());
        misses = 0;
        ok = true;
        if (j && j.kind && j.kind !== "noop") {
          busy = true;
          // Anything thrown in here used to leave busy latched and the plugin silent for good.
          try { await runJob(j); }
          catch (jerr) {
            busy = false;
            stopBeat();
            log("job " + j.id + " failed: " + jerr);
            status("job failed — " + jerr, "off");
            try { await post("/report", { id: j.id, report: { error: String(jerr && jerr.message || jerr) } }); } catch (e2) {}
          }
        } else status("idle — waiting for the next job", "on");
      } catch (err) {
        misses++;
        if (misses > 2) status("runner not reachable on " + HOST, "off");
      }
      if (!ok) {
        // The runner is not there. This is the one place a timer belongs: something has to slow
        // the retries down, and being a minute late to notice a runner that has just started is
        // survivable — the runner waits five minutes before drawing conclusions.
        polling = false;
        setTimeout(poll, 1000);
        return;
      }
    }
  } catch (fatal) {
    // nothing may stop the loop: a stopped loop looks exactly like a working plugin
    log("poll error: " + fatal);
    polling = false;
    setTimeout(poll, 1000);
    return;
  }
  polling = false;
}
poll();
</script>
